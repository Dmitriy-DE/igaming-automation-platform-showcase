<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="455" viewBox="0 0 1600 455"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050c12"/><stop offset=".6" stop-color="#07131b"/><stop offset="1" stop-color="#090f15"/></linearGradient><pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#0d2430"/></pattern></defs><rect width="1600" height="455" rx="28" fill="url(#bg)"/><rect width="1600" height="455" rx="28" fill="url(#grid)" opacity=".3"/><rect x="1" y="1" width="1598" height="453" rx="27" fill="none" stroke="#1d5266"/><text x="36" y="44" fill="#16d9ff" font-family="monospace" font-size="15">› core_model</text><text x="270" y="44" fill="#879eaa" font-family="Arial" font-size="12">Project boundaries are the architecture.</text>
<g transform="translate(40 90)"><rect width="220" height="76" rx="13" fill="#091720" stroke="#16d9ff" stroke-opacity=".65"/><text x="110" y="30" text-anchor="middle" fill="#16d9ff" font-family="monospace" font-size="9">PROJECT A</text><text x="110" y="54" text-anchor="middle" fill="#ccd9df" font-family="Arial" font-size="10.5">owns business logic</text></g><g transform="translate(300 90)"><rect width="220" height="76" rx="13" fill="#091720" stroke="#8b5cf6" stroke-opacity=".65"/><text x="110" y="30" text-anchor="middle" fill="#8b5cf6" font-family="monospace" font-size="9">PROJECT B</text><text x="110" y="54" text-anchor="middle" fill="#ccd9df" font-family="Arial" font-size="10.5">owns business logic</text></g><g transform="translate(560 90)"><rect width="220" height="76" rx="13" fill="#091720" stroke="#2fe3b0" stroke-opacity=".65"/><text x="110" y="30" text-anchor="middle" fill="#2fe3b0" font-family="monospace" font-size="9">PROJECT C</text><text x="110" y="54" text-anchor="middle" fill="#ccd9df" font-family="Arial" font-size="10.5">owns business logic</text></g><g transform="translate(820 90)"><rect width="220" height="76" rx="13" fill="#091720" stroke="#ffb547" stroke-opacity=".65"/><text x="110" y="30" text-anchor="middle" fill="#ffb547" font-family="monospace" font-size="9">PROJECT D</text><text x="110" y="54" text-anchor="middle" fill="#ccd9df" font-family="Arial" font-size="10.5">owns business logic</text></g><rect x="40" y="220" width="1000" height="100" rx="15" fill="#08141d" stroke="#1d5266"/><text x="60" y="252" fill="#16d9ff" font-family="monospace" font-size="10">SHARED/</text><text x="60" y="288" fill="#f4f8fb" font-family="Arial" font-size="18" font-weight="700">Infrastructure helpers only — not a dumping ground for business rules.</text><text x="60" y="309" fill="#879eaa" font-family="Arial" font-size="10.5">Examples: DB configuration, common adapters, reusable payment/AI routing primitives.</text><g transform="translate(1090 80)"><g transform="translate(0 0)"><rect width="430" height="110" rx="15" fill="#08141d" stroke="#1d5266"/><rect width="4" height="110" rx="2" fill="#ffb547"/><text x="18" y="25" fill="#ffb547" font-family="monospace" font-size="9">LAW</text><text x="18" y="51" fill="#f4f8fb" font-family="Arial" font-size="15" font-weight="700">No cross-project business imports</text><text x="18" y="76" fill="#879eaa" font-family="Arial" font-size="10.5">projects/A does not import projects/B</text></g><g transform="translate(0 130)"><rect width="430" height="110" rx="15" fill="#08141d" stroke="#1d5266"/><rect width="4" height="110" rx="2" fill="#2fe3b0"/><text x="18" y="25" fill="#2fe3b0" font-family="monospace" font-size="9">EXCEPTIONS</text><text x="18" y="51" fill="#f4f8fb" font-family="Arial" font-size="15" font-weight="700">Explicit control-plane edges</text><text x="18" y="76" fill="#879eaa" font-family="Arial" font-size="10.5">read-only metrics · offline exports · DI-owned admin routes</text></g><g transform="translate(0 260)"><rect width="430" height="110" rx="15" fill="#08141d" stroke="#1d5266"/><rect width="4" height="110" rx="2" fill="#ff6b6b"/><text x="18" y="25" fill="#ff6b6b" font-family="monospace" font-size="9">SECRETS</text><text x="18" y="51" fill="#f4f8fb" font-family="Arial" font-size="15" font-weight="700">Owned by each runtime</text><text x="18" y="76" fill="#879eaa" font-family="Arial" font-size="10.5">keys are isolated; sharing them through common code is forbidden</text></g></g></svg>