<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="195" viewBox="0 0 1600 195"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050c12"/><stop offset=".6" stop-color="#07131b"/><stop offset="1" stop-color="#090f15"/></linearGradient><pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#0d2430"/></pattern></defs><rect width="1600" height="195" rx="28" fill="url(#bg)"/><rect width="1600" height="195" rx="28" fill="url(#grid)" opacity=".3"/><rect x="1" y="1" width="1598" height="193" rx="27" fill="none" stroke="#1d5266"/><text x="36" y="44" fill="#16d9ff" font-family="monospace" font-size="15">› engineering_signature</text><text x="270" y="44" fill="#879eaa" font-family="Arial" font-size="12">Rules that keep a large monorepo from becoming one large accident.</text>
<g transform="translate(35 70)"><rect width="365" height="92" rx="15" fill="#08141d" stroke="#1d5266"/><rect width="4" height="92" rx="2" fill="#16d9ff"/><text x="18" y="25" fill="#16d9ff" font-family="monospace" font-size="9">ISOLATION</text><text x="18" y="51" fill="#f4f8fb" font-family="Arial" font-size="15" font-weight="700">Business logic stays local</text><text x="18" y="76" fill="#879eaa" font-family="Arial" font-size="10.5">shared code is infrastructure, not a shortcut</text></g><g transform="translate(416 70)"><rect width="365" height="92" rx="15" fill="#08141d" stroke="#1d5266"/><rect width="4" height="92" rx="2" fill="#2fe3b0"/><text x="18" y="25" fill="#2fe3b0" font-family="monospace" font-size="9">FACTUAL STATUS</text><text x="18" y="51" fill="#f4f8fb" font-family="Arial" font-size="15" font-weight="700">Runtime truth stays explicit</text><text x="18" y="76" fill="#879eaa" font-family="Arial" font-size="10.5">inactive and not-deployed are valid states</text></g><g transform="translate(797 70)"><rect width="365" height="92" rx="15" fill="#08141d" stroke="#1d5266"/><rect width="4" height="92" rx="2" fill="#55b6ff"/><text x="18" y="25" fill="#55b6ff" font-family="monospace" font-size="9">VERSIONED OPS</text><text x="18" y="51" fill="#f4f8fb" font-family="Arial" font-size="15" font-weight="700">Jobs and deploy stay in Git</text><text x="18" y="76" fill="#879eaa" font-family="Arial" font-size="10.5">repeated operational work becomes automation</text></g><g transform="translate(1178 70)"><rect width="387" height="92" rx="15" fill="#08141d" stroke="#1d5266"/><rect width="4" height="92" rx="2" fill="#ffb547"/><text x="18" y="25" fill="#ffb547" font-family="monospace" font-size="9">CHANGE CONTROL</text><text x="18" y="51" fill="#f4f8fb" font-family="Arial" font-size="15" font-weight="700">Sensitive paths are gated</text><text x="18" y="76" fill="#879eaa" font-family="Arial" font-size="10.5">frozen money/lifecycle boundaries need owner approval</text></g></svg>