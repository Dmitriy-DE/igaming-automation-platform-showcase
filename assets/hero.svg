<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="535" viewBox="0 0 1600 535"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050c12"/><stop offset=".6" stop-color="#07131b"/><stop offset="1" stop-color="#090f15"/></linearGradient><pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#0d2430"/></pattern></defs><rect width="1600" height="535" rx="28" fill="url(#bg)"/><rect width="1600" height="535" rx="28" fill="url(#grid)" opacity=".3"/><rect x="1" y="1" width="1598" height="533" rx="27" fill="none" stroke="#1d5266"/><text x="44" y="50" fill="#16d9ff" font-family="monospace" font-size="15">› casino-mailer / igaming-automation-platform-showcase</text><text x="44" y="120" fill="#f4f8fb" font-family="Arial" font-size="66" font-weight="800">Multi-service Automation Platform</text><text x="44" y="162" fill="#b8cad4" font-family="Arial" font-size="21">A monorepo for 18 service and product directions.</text><text x="44" y="196" fill="#879eaa" font-family="Arial" font-size="17">Messaging, bots, APIs, data processing, AI tooling, workers, content pipelines and infrastructure under one control model.</text><rect x="44" y="232" width="850" height="102" rx="15" fill="#08141d" stroke="#1d5266"/><text x="65" y="262" fill="#ffb547" font-family="monospace" font-size="10">CURRENT TRUTH</text><text x="65" y="300" fill="#f4f8fb" font-family="Arial" font-size="29" font-weight="800">Architecture showcase — not a live-production claim.</text><text x="65" y="323" fill="#879eaa" font-family="Arial" font-size="11">The codebase is being prepared for independent cloud deployment; runtime status remains factual and explicit.</text><g transform="translate(44 365)"><rect width="156" height="38" rx="8" fill="#081722" stroke="#1d5266"/><text x="78" y="24" text-anchor="middle" fill="#8b5cf6" font-family="monospace" font-size="10">18 directions</text></g><g transform="translate(214 365)"><rect width="1