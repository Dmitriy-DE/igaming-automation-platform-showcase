<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061018"/><stop offset="1" stop-color="#0b1118"/></linearGradient></defs>
<rect width="1600" height="560" rx="26" fill="url(#bg)"/><rect x="1" y="1" width="1598" height="558" rx="25" fill="none" stroke="#1d5266"/>
<text x="48" y="58" fill="#16d9ff" font-family="monospace" font-size="24" font-weight="700">18 DIRECTIONS · ONE MONOREPO · DIFFERENT OWNERSHIP</text>
<text x="48" y="92" fill="#a8bcc8" font-family="Arial" font-size="21">This is a portfolio of services/products, not one giant application pretending to be modular.</text>

<g font-family="Arial">
<g transform="translate(42 132)"><rect width="360" height="350" rx="18" fill="#0a1720" stroke="#ffb547"/><text x="24" y="42" fill="#ffb547" font-size="27" font-weight="700">Messaging / lifecycle</text><text x="24" y="80" fill="#f0f4f6" font-size="18">Commercial messaging paths</text><text x="24" y="124" fill="#a3b4be" font-size="16">• casino-mailer</text><text x="24" y="154" fill="#a3b4be" font-size="16">• SMS / blitz</text><text x="24" y="184" fill="#a3b4be" font-size="16">• mailer optimisation patterns</text><text x="24" y="214" fill="#a3b4be" font-size="16">• sub-affiliate attribution pattern</text><text x="24" y="260" fill="#66df91" font-size="16" font-weight="700">Change-sensitive / money-path aware</text><text x="24" y="290" fill="#8ea3af" font-size="15">Not every direction is a separate runtime.</text></g>

<g transform="translate(422 132)"><rect width="360" height="350" rx="18" fill="#0a1720" stroke="#55b6ff"/><text x="24" y="42" fill="#55b6ff" font-size="27" font-weight="700">Telegram products</text><text x="24" y="80" fill="#f0f4f6" font-size="18">Bots, accounts and delivery tools</text><text x="24" y="124" fill="#a3b4be" font-size="16">• phantom</text><text x="24" y="154" fill="#a3b4be" font-size="16">• hatchery</text><text x="24" y="184" fill="#a3b4be" font-size="16">• amar</text><text x="24" y="214" fill="#a3b4be" font-size="16">• related account / proxy flows</text><text x="24" y="260" fill="#66df91" font-size="16" font-weight="700">Independent runtime ownership</text><text x="24" y="290" fill="#8ea3af" font-size="15">Own env, secrets, data and health.</text></g>

<g transform="translate(802 132)"><rect width="360" height="350" rx="18" fill="#0a1720" stroke="#8b5cf6"/><text x="24" y="42" fill="#b89cff" font-size="27" font-weight="700">Data / AI / content</text><text x="24" y="80" fill="#f0f4f6" font-size="18">Processing and product services</text><text x="24" y="124" fill="#a3b4be" font-size="16">• vault · spider · gdm</text><text x="24" y="154" fill="#a3b4be" font-size="16">• llm · ACF</text><text x="24" y="184" fill="#a3b4be" font-size="16">• meridian · velvet</text><text x="24" y="214" fill="#a3b4be" font-size="16">• oracle</text><text x="24" y="260" fill="#66df91" font-size="16" font-weight="700">Service-specific contracts</text><text x="24" y="290" fill="#8ea3af" font-size="15">Shared helpers do not own business rules.</text></g>

<g transform="translate(1182 132)"><rect width="376" height="350" rx="18" fill="#0a1720" stroke="#2fe3b0"/><text x="24" y="42" fill="#2fe3b0" font-size="27" font-weight="700">Platform / infrastructure</text><text x="24" y="80" fill="#f0f4f6" font-size="18">Control plane and deployment pieces</text><text x="24" y="124" fill="#a3b4be" font-size="16">• nexus / billing foundation</text><text x="24" y="154" fill="#a3b4be" font-size="16">• conduit / proxy provisioning</text><text x="24" y="184" fill="#a3b4be" font-size="16">• admin SPA</text><text x="24" y="214" fill="#a3b4be" font-size="16">• schedulers / deploy manifests</text><text x="24" y="260" fill="#66df91" font-size="16" font-weight="700">Portfolio visibility, not god-process</text><text x="24" y="290" fill="#8ea3af" font-size="15">Cross-project reads must be explicit.</text></g>
</g>
</svg>